<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css</title>
    <!-- internal css -->
    <style>
        /* h2: selector */
        h2 {
            background-color: red;
            /* attribute: value; */
        }
    </style>
    <!-- external css -->
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <!-- inline css-->
    <h1 style="background-color: aqua;">Cascading style sheet(CSS)</h1>
    <h2>division tag</h2>
    <h3>Lorem ipsum dolor sit amet consectetur adipisicing elit. Consectetur nulla iste quia maxime sed laboriosam, dolor necessitatibus qui, quis quisquam pariatur officia provident ipsum iusto debitis ullam? Ex, consequuntur officiis!</h3>
    <!-- 
    css types
    1. inline css
    2. internal css
    3. external css
    -->
</body>

</html>
