<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>

<body>
    <!-- comment: ctrl + / -->
    <!-- list in html -->
    <h1>List of fruits</h1>
    <!-- unordered list -->
    <ul type="circle">
        <li>apple</li>
        <li>kiwi</li>
        <li>papaya</li>
        <li>strawberry</li>
    </ul>

    <h1>List of laptops</h1>
    <!-- ordered list -->
    <ol type="1" start="2">
        <li>lenove</li>
        <li>asus</li>
        <li>samsung</li>
        <li>aspire</li>
    </ol>

</body>

</html>
